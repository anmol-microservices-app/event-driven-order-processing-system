apiVersion: v1
kind: Namespace
metadata:
  name: kafka-project

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orderservice-config
  namespace: kafka-project

data:
  SERVER_PORT: "8000"

  # Kafka Configuration
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092

  # Database Configuration
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kafka_project

  # JPA Configuration
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect


---
apiVersion: v1
kind: Secret
metadata:
  name: orderservice-secret
  namespace: kafka-project

type: Opaque

stringData:
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: Radha@2322


---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: orderservice
  namespace: kafka-project

spec:
  replicas: 1

  selector:
    matchLabels:
      app: orderservice

  template:
    metadata:
      labels:
        app: orderservice

    spec:
      containers:

      - name: orderservice

        image: 837095526806.dkr.ecr.us-east-1.amazonaws.com/order_service_ecr:latest

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 8000


        envFrom:

        - configMapRef:
            name: orderservice-config

        - secretRef:
            name: orderservice-secret


        resources:

          requests:
            cpu: "250m"
            memory: "512Mi"

          limits:
            cpu: "500m"
            memory: "1Gi"


        livenessProbe:

          httpGet:
            path: /actuator/health
            port: 8000

          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 5


        readinessProbe:

          httpGet:
            path: /actuator/health
            port: 8000

          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5



---
apiVersion: v1
kind: Service

metadata:
  name: orderservice
  namespace: kafka-project


spec:

  selector:
    app: orderservice


  ports:

  - port: 80
    targetPort: 8000


  type: LoadBalancer