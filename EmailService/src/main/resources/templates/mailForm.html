<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Send Email</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            width: 420px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            font-weight: 600;
            color: #555;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #4facfe;
            box-shadow: 0 0 6px rgba(79,172,254,0.6);
        }

        textarea {
            resize: none;
        }

        input[type=file] {
            padding: 8px;
            background: #f7f7f7;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(to right, #4facfe, #00c6ff);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }

        #result {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>📨 Send Email</h2>

    <form id="emailForm" enctype="multipart/form-data">

        <label>To</label>
        <input type="email" id="to" required>

        <label>Subject</label>
        <input type="text" id="subject" required>

        <label>Message</label>
        <textarea id="message" rows="5" required></textarea>

        <label>Attachment (Optional)</label>
        <input type="file" id="attachment">

        <button type="submit">Send</button>

    </form>

    <p id="result"></p>

</div>

<script>

document.getElementById("emailForm").addEventListener("submit", function(e){

    e.preventDefault();

    let formData = new FormData();

    formData.append("to", document.getElementById("to").value);
    formData.append("subject", document.getElementById("subject").value);
    formData.append("message", document.getElementById("message").value);

    const file = document.getElementById("attachment").files[0];

    if(file){
        formData.append("attachment", file);
    }

    fetch("emailservice/sendemail",{

        method:"POST",
        body:formData

    })
    .then(response => response.text())
    .then(data => {

        document.getElementById("result").innerHTML = data;

        document.getElementById("emailForm").reset();

    })
    .catch(error => {

        console.error(error);

        document.getElementById("result").innerHTML = "Error sending email.";

    });

});

</script>

</body>
</html>
